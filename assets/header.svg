<svg width="900" height="310" viewBox="0 0 900 310" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    @keyframes pulse {
      0%,100%{opacity:1;} 50%{opacity:0.6;}
    }
    @keyframes blink {
      0%,100%{opacity:1;} 50%{opacity:0;}
    }
    @keyframes corner-pulse {
      0%,100%{opacity:0.3;} 50%{opacity:1;}
    }
    @keyframes corner-pulse-alt {
      0%,100%{opacity:1;} 50%{opacity:0.3;}
    }
    @keyframes sub-fade {
      0%{opacity:0;} 100%{opacity:0.9;}
    }
    @keyframes tag-fade {
      0%{opacity:0;} 100%{opacity:0.65;}
    }
  </style>

  <!-- Background gradient -->
  <linearGradient id="bg" x1="0" y1="0" x2="900" y2="310" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#060A0F"/>
    <stop offset="40%" stop-color="#0D1117"/>
    <stop offset="100%" stop-color="#080D14"/>
  </linearGradient>

  <!-- Title gradient - animates between 3 colors -->
  <linearGradient id="tg" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#00FF94">
      <animate attributeName="stop-color" values="#00FF94;#00D4FF;#7B2FBE;#00FF94" dur="6s" repeatCount="indefinite"/>
    </stop>
    <stop offset="50%" stop-color="#00D4FF">
      <animate attributeName="stop-color" values="#00D4FF;#7B2FBE;#00FF94;#00D4FF" dur="6s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#7B2FBE">
      <animate attributeName="stop-color" values="#7B2FBE;#00FF94;#00D4FF;#7B2FBE" dur="6s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>

  <!-- Line gradients -->
  <linearGradient id="ll" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00FF94" stop-opacity="0"/>
    <stop offset="100%" stop-color="#00FF94" stop-opacity="1"/>
  </linearGradient>
  <linearGradient id="lr" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#00FF94" stop-opacity="1"/>
    <stop offset="100%" stop-color="#00FF94" stop-opacity="0"/>
  </linearGradient>

  <!-- Scan line gradient -->
  <linearGradient id="sl" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#00FF94" stop-opacity="0"/>
    <stop offset="50%" stop-color="#00FF94" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#00FF94" stop-opacity="0"/>
  </linearGradient>

  <!-- Text glow filter -->
  <filter id="tglow" x="-20%" y="-40%" width="140%" height="180%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Corner glow filter -->
  <filter id="cglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <clipPath id="clip">
    <rect width="900" height="310"/>
  </clipPath>
</defs>

<!-- Background -->
<rect width="900" height="310" fill="url(#bg)"/>

<!-- Subtle grid -->
<g clip-path="url(#clip)" opacity="0.06">
  <line x1="0" y1="31" x2="900" y2="31" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="0" y1="62" x2="900" y2="62" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="0" y1="93" x2="900" y2="93" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="0" y1="124" x2="900" y2="124" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="0" y1="155" x2="900" y2="155" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="0" y1="186" x2="900" y2="186" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="0" y1="217" x2="900" y2="217" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="0" y1="248" x2="900" y2="248" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="0" y1="279" x2="900" y2="279" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="45" y1="0" x2="45" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="90" y1="0" x2="90" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="135" y1="0" x2="135" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="180" y1="0" x2="180" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="225" y1="0" x2="225" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="270" y1="0" x2="270" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="315" y1="0" x2="315" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="360" y1="0" x2="360" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="405" y1="0" x2="405" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="450" y1="0" x2="450" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="495" y1="0" x2="495" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="540" y1="0" x2="540" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="585" y1="0" x2="585" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="630" y1="0" x2="630" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="675" y1="0" x2="675" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="720" y1="0" x2="720" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="765" y1="0" x2="765" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="810" y1="0" x2="810" y2="310" stroke="#00FF94" stroke-width="0.5"/>
  <line x1="855" y1="0" x2="855" y2="310" stroke="#00FF94" stroke-width="0.5"/>
</g>

<!-- Scan line sweep -->
<rect x="0" width="900" height="30" fill="url(#sl)">
  <animate attributeName="y" from="-30" to="310" dur="5s" repeatCount="indefinite"/>
</rect>

<!-- Floating particles -->
<circle cx="80" cy="0" r="1.8" fill="#00FF94">
  <animate attributeName="cy" from="300" to="-5" dur="4.2s" begin="0s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.85;1" dur="4.2s" begin="0s" repeatCount="indefinite"/>
</circle>
<circle cx="180" cy="0" r="1.2" fill="#00D4FF">
  <animate attributeName="cy" from="300" to="-5" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.85;1" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
</circle>
<circle cx="300" cy="0" r="2" fill="#7B2FBE">
  <animate attributeName="cy" from="300" to="-5" dur="5s" begin="1.1s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.85;1" dur="5s" begin="1.1s" repeatCount="indefinite"/>
</circle>
<circle cx="420" cy="0" r="1.5" fill="#00FF94">
  <animate attributeName="cy" from="300" to="-5" dur="4.8s" begin="0.3s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.85;1" dur="4.8s" begin="0.3s" repeatCount="indefinite"/>
</circle>
<circle cx="540" cy="0" r="1" fill="#00D4FF">
  <animate attributeName="cy" from="300" to="-5" dur="3.2s" begin="1.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.1;0.85;1" dur="3.2s" begin="1.8s" repeatCount="indefinite"/>
</circle>
<circle cx="660" cy="0" r="1.8" fill="#00FF94">
  <animate attributeName="cy" from="300" to="-5" dur="4s" begin="0.9s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.85;1" dur="4s" begin="0.9s" repeatCount="indefinite"/>
</circle>
<circle cx="780" cy="0" r="1.2" fill="#7B2FBE">
  <animate attributeName="cy" from="300" to="-5" dur="4.5s" begin="0.4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.75;0.75;0" keyTimes="0;0.1;0.85;1" dur="4.5s" begin="0.4s" repeatCount="indefinite"/>
</circle>
<circle cx="860" cy="0" r="1.5" fill="#00D4FF">
  <animate attributeName="cy" from="300" to="-5" dur="3.8s" begin="2.1s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.85;1" dur="3.8s" begin="2.1s" repeatCount="indefinite"/>
</circle>
<circle cx="240" cy="0" r="1" fill="#00FF94">
  <animate attributeName="cy" from="300" to="-5" dur="5.2s" begin="1.4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.1;0.85;1" dur="5.2s" begin="1.4s" repeatCount="indefinite"/>
</circle>
<circle cx="600" cy="0" r="2" fill="#00FF94">
  <animate attributeName="cy" from="300" to="-5" dur="3.9s" begin="2.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.85;1" dur="3.9s" begin="2.5s" repeatCount="indefinite"/>
</circle>

<!-- Corner brackets TL -->
<path d="M 22 75 L 22 22 L 75 22" stroke="#00FF94" stroke-width="2.5" fill="none" filter="url(#cglow)" style="animation: corner-pulse 2.5s ease-in-out infinite;"/>

<!-- Corner brackets TR -->
<path d="M 825 22 L 878 22 L 878 75" stroke="#00FF94" stroke-width="2.5" fill="none" filter="url(#cglow)" style="animation: corner-pulse-alt 2.5s ease-in-out infinite;"/>

<!-- Corner brackets BL -->
<path d="M 22 235 L 22 288 L 75 288" stroke="#00D4FF" stroke-width="2.5" fill="none" filter="url(#cglow)" style="animation: corner-pulse-alt 2.5s ease-in-out infinite;"/>

<!-- Corner brackets BR -->
<path d="M 825 288 L 878 288 L 878 235" stroke="#00D4FF" stroke-width="2.5" fill="none" filter="url(#cglow)" style="animation: corner-pulse 2.5s ease-in-out infinite;"/>

<!-- Small corner dots -->
<circle cx="22" cy="22" r="3" fill="#00FF94" style="animation: pulse 2.5s ease-in-out infinite;"/>
<circle cx="878" cy="22" r="3" fill="#00FF94" style="animation: corner-pulse-alt 2.5s ease-in-out infinite;"/>
<circle cx="22" cy="288" r="3" fill="#00D4FF" style="animation: corner-pulse-alt 2.5s ease-in-out infinite;"/>
<circle cx="878" cy="288" r="3" fill="#00D4FF" style="animation: pulse 2.5s ease-in-out infinite;"/>

<!-- 3D depth layers for title (creates 3D extrusion effect) -->
<text x="456" y="148" font-family="Courier New, monospace" font-size="68" font-weight="900" text-anchor="middle" fill="#001A0A" letter-spacing="3">ramanneonx</text>
<text x="454" y="146" font-family="Courier New, monospace" font-size="68" font-weight="900" text-anchor="middle" fill="#002A10" letter-spacing="3">ramanneonx</text>
<text x="452" y="144" font-family="Courier New, monospace" font-size="68" font-weight="900" text-anchor="middle" fill="#003A18" letter-spacing="3">ramanneonx</text>
<text x="450" y="142" font-family="Courier New, monospace" font-size="68" font-weight="900" text-anchor="middle" fill="#004D20" letter-spacing="3">ramanneonx</text>

<!-- Main title - gradient + glow -->
<text x="450" y="140" font-family="Courier New, monospace" font-size="68" font-weight="900" text-anchor="middle" fill="url(#tg)" filter="url(#tglow)" letter-spacing="3" style="animation: pulse 3s ease-in-out infinite;">ramanneonx</text>

<!-- Accent lines flanking center -->
<rect x="60" y="158" width="270" height="1.5" fill="url(#ll)"/>
<rect x="570" y="158" width="270" height="1.5" fill="url(#lr)"/>

<!-- Center diamond decoration -->
<polygon points="450,150 458,158 450,166 442,158" fill="none" stroke="#00FF94" stroke-width="1.5" style="animation: pulse 2s ease-in-out infinite;"/>

<!-- Subtitle -->
<text x="450" y="196" font-family="Courier New, monospace" font-size="14" text-anchor="middle" letter-spacing="4" fill="#00D4FF" style="animation: sub-fade 1.5s ease-out forwards;">BUILDER  ·  SECURITY RESEARCHER  ·  BUG BOUNTY HUNTER</text>

<!-- Bottom tag -->
<text x="442" y="240" font-family="Courier New, monospace" font-size="11.5" text-anchor="middle" letter-spacing="2" fill="#7B2FBE" style="animation: tag-fade 2s ease-out forwards;">&#62;&#62; ship fast. break things. fix them faster. &#60;&#60;</text>

<!-- Blinking cursor -->
<rect x="742" y="228" width="9" height="14" fill="#7B2FBE" style="animation: blink 1s step-end infinite;"/>

<!-- Side decorative lines -->
<line x1="22" y1="155" x2="22" y2="175" stroke="#00FF94" stroke-width="1.5" style="animation: pulse 2s ease-in-out infinite;"/>
<line x1="878" y1="155" x2="878" y2="175" stroke="#00FF94" stroke-width="1.5" style="animation: corner-pulse-alt 2s ease-in-out infinite;"/>

</svg>
